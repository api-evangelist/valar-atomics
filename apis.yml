name: Valar Atomics
description: >-
  Valar Atomics is a nuclear energy company developing high-temperature gas
  reactors (HTGR) with TRISO fuel, graphite moderators, and helium coolant,
  deployed as grid-independent gigasites of many small reactors that power
  heavy industry - hydrogen production via the sulfur-iodine cycle, AI data
  center power, industrial process heat, and clean synthetic hydrocarbon fuels
  via Fischer-Tropsch synthesis with captured CO2. Its Ward 250 test reactor
  is a partnership with the U.S. Department of Energy, the San Rafael Energy
  Research Center, and the State of Utah. Founded by Isaiah Taylor and backed
  by Initialized Capital, the company publishes no public API or developer
  surface as of July 2026.
